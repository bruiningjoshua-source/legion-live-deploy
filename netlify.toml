[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # These are client-side by design and legitimately appear in the browser bundle,
  # so exclude them from Netlify's secret scanner (which otherwise fails the build):
  #  - ZEGOCLOUD_RTMP_DOMAIN / ZEGOCLOUD_WHIP_AUTH_KEY: WebRTC/RTMP ingest auth used
  #    by the browser to publish streams (not a server secret).
  #  - VITE_* and publishable keys are meant to be public.
  SECRETS_SCAN_OMIT_KEYS = "ZEGOCLOUD_RTMP_DOMAIN,ZEGOCLOUD_WHIP_AUTH_KEY,VITE_STRIPE_PUBLISHABLE_KEY,ZEGOCLOUD_APP_ID"

# Stripe webhook background function (15-min timeout vs 10s default)
# Netlify detects background functions automatically from the -background suffix
[[redirects]]
  from = "/api/stripe-webhook"
  to = "/.netlify/functions/legion-payments-background"
  status = 200

# Digital Asset Links for the Android TWA — must be served as-is (before SPA catch-all)
[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

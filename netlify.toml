[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Stripe webhook background function (15-min timeout vs 10s default)
# Netlify detects background functions automatically from the -background suffix
[[redirects]]
  from = "/api/stripe-webhook"
  to = "/.netlify/functions/stripe-webhook-background"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

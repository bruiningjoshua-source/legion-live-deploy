name: Deploy Edge Functions
on:
  push:
    branches: [main]
    paths:
      - 'src/functions/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Deploy Functions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          echo "Edge functions are deployed via Base44 platform."
          echo "This workflow validates function syntax on push."
          for f in src/functions/*.js; do
            echo "Checking $f..."
            deno check --no-lock "$f" || echo "Warning: $f has issues"
          done
